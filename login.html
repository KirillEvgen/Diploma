<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация - SkyFitnessPro</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-logo">
                <a href="index.html" class="logo">
                    <div class="logo__icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <path d="M8 5V19L19 12L8 5Z" fill="url(#playGradient)"/>
                            <defs>
                                <linearGradient id="playGradient" x1="8" y1="5" x2="19" y2="12" gradientUnits="userSpaceOnUse">
                                    <stop stop-color="#00C1FF"/>
                                    <stop offset="1" stop-color="#99D100"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <span class="logo__text">SkyFitnessPro</span>
                </a>
            </div>

            <!-- Форма авторизации -->
            <form class="auth-form auth-form--login" id="loginForm">
                <div class="auth-form__fields">
                    <div class="auth-form__field">
                        <input 
                            type="text" 
                            id="loginUsername" 
                            name="username" 
                            class="auth-form__input" 
                            placeholder="Логин"
                            required
                        >
                    </div>
                    <div class="auth-form__field">
                        <input 
                            type="password" 
                            id="loginPassword" 
                            name="password" 
                            class="auth-form__input" 
                            placeholder="Пароль"
                            required
                        >
                        <p class="auth-form__error" id="loginError"></p>
                    </div>
                </div>
                <div class="auth-form__actions">
                    <button type="submit" class="btn btn--primary btn--full">Войти</button>
                    <button type="button" class="btn btn--secondary btn--full" id="switchToRegister">Зарегистрироваться</button>
                </div>
            </form>

            <!-- Форма регистрации -->
            <form class="auth-form auth-form--register" id="registerForm" style="display: none;">
                <div class="auth-form__fields">
                    <div class="auth-form__field">
                        <input 
                            type="email" 
                            id="registerEmail" 
                            name="email" 
                            class="auth-form__input" 
                            placeholder="Эл. почта"
                            required
                        >
                    </div>
                    <div class="auth-form__field">
                        <input 
                            type="password" 
                            id="registerPassword" 
                            name="password" 
                            class="auth-form__input" 
                            placeholder="Пароль"
                            required
                        >
                    </div>
                    <div class="auth-form__field">
                        <input 
                            type="password" 
                            id="registerPasswordConfirm" 
                            name="passwordConfirm" 
                            class="auth-form__input" 
                            placeholder="Повторите пароль"
                            required
                        >
                        <p class="auth-form__error" id="registerError"></p>
                    </div>
                </div>
                <div class="auth-form__actions">
                    <button type="submit" class="btn btn--primary btn--full">Зарегистрироваться</button>
                    <button type="button" class="btn btn--secondary btn--full" id="switchToLogin">Войти</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
